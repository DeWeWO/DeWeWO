  <text x="58" y="212" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">stack</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
