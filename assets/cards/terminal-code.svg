  <text x="38" y="383" text-anchor="end" font-size="11" fill="#484f58">18</text>
  <text x="58" y="383" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">    def </tspan><tspan fill="#d2a8ff">get_mission</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ff7b72">self</tspan><tspan fill="#c9d1d9">):</tspan></text>
  <text x="38" y="402" text-anchor="end" font-size="11" fill="#484f58">19</text>
  <text x="58" y="402" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        return </tspan><tspan fill="#a5d6ff">&quot;Engineering resilient, scalable systems.&quot;</tspan></text>
