  <text x="58" y="98" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">username</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;DeWeW&quot;</tspan></text>
  <text x="38" y="117" text-anchor="end" font-size="11" fill="#484f58">4</text>
  <text x="58" y="117" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">fullname</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;Ollabergan Zaripboyev&quot;</tspan></text>
  <text x="38" y="136" text-anchor="end" font-size="11" fill="#484f58">5</text>
  <text x="58" y="136" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">role</tspan><tspan fill="#c9d1d9">     = </tspan><tspan fill="#a5d6ff">&quot;Software Engineer&quot;</tspan></text>
  <text x="38" y="155" text-anchor="end" font-size="11" fill="#484f58">6</text>
