  <text x="58" y="79" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">    def </tspan><tspan fill="#d2a8ff">__init__</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ff7b72">self</tspan><tspan fill="#c9d1d9">):</tspan></text>
