  <text x="38" y="250" text-anchor="end" font-size="11" fill="#484f58">11</text>
  <text x="58" y="250" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;frontend&quot;</tspan><tspan fill="#c9d1d9">    : [</tspan><tspan fill="#79c0ff">&quot;React&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;JavaScript&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;HTML5&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;CSS3&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="269" text-anchor="end" font-size="11" fill="#484f58">12</text>
  <text x="58" y="269" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;databases&quot;</tspan><tspan fill="#c9d1d9">   : [</tspan><tspan fill="#79c0ff">&quot;PostgreSQL&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;MySQL&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;MongoDB&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="288" text-anchor="end" font-size="11" fill="#484f58">13</text>
  <text x="58" y="288" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;devops&quot;</tspan><tspan fill="#c9d1d9">      : [</tspan><tspan fill="#79c0ff">&quot;Docker&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Git&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;GitHub Actions&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Linux&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="307" text-anchor="end" font-size="11" fill="#484f58">14</text>
  <text x="58" y="307" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;mobile&quot;</tspan><tspan fill="#c9d1d9">      : [</tspan><tspan fill="#79c0ff">&quot;Flutter&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Dart&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Android&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="326" text-anchor="end" font-size="11" fill="#484f58">15</text>
  <text x="58" y="326" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;architecture&quot;</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#79c0ff">&quot;System Design&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Microservices&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Clean Code&quot;</tspan><tspan fill="#c9d1d9">]</tspan></text>
  <text x="38" y="345" text-anchor="end" font-size="11" fill="#484f58">16</text>
  <text x="58" y="345" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">        }</tspan></text>
