  <text x="58" y="55" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">class </tspan><tspan fill="#7ee787">SoftwareEngineer</tspan><tspan fill="#c9d1d9">:</tspan></text>
  <text x="38" y="74" text-anchor="end" font-size="11" fill="#484f58">2</text>
  <text x="58" y="74" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">    def </tspan><tspan fill="#d2a8ff">__init__</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ff7b72">self</tspan><tspan fill="#c9d1d9">):</tspan></text>
  <text x="38" y="93" text-anchor="end" font-size="11" fill="#484f58">3</text>
  <text x="58" y="93" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">username</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;DeWeW&quot;</tspan></text>
  <text x="38" y="112" text-anchor="end" font-size="11" fill="#484f58">4</text>
  <text x="58" y="112" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">fullname</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;Ollabergan Zaripboyev&quot;</tspan></text>
  <text x="38" y="131" text-anchor="end" font-size="11" fill="#484f58">5</text>
  <text x="58" y="131" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">role</tspan><tspan fill="#c9d1d9">     = </tspan><tspan fill="#a5d6ff">&quot;Software Engineer&quot;</tspan></text>
  <text x="38" y="150" text-anchor="end" font-size="11" fill="#484f58">6</text>
  <text x="58" y="150" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">location</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;Urgench, Uzbekistan&quot;</tspan></text>
  <text x="38" y="169" text-anchor="end" font-size="11" fill="#484f58">7</text>
  <text x="58" y="169" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">status</tspan><tspan fill="#c9d1d9">   = </tspan><tspan fill="#a5d6ff">&quot;Open to Opportunities&quot;</tspan></text>
  <text x="38" y="188" text-anchor="end" font-size="11" fill="#484f58">8</text>
  <text x="38" y="207" text-anchor="end" font-size="11" fill="#484f58">9</text>
  <text x="58" y="207" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">stack</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
  <text x="38" y="226" text-anchor="end" font-size="11" fill="#484f58">10</text>
  <text x="58" y="226" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;backend&quot;</tspan><tspan fill="#c9d1d9">     : [</tspan><tspan fill="#79c0ff">&quot;Python&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Django&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;DRF&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;PHP&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Laravel&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="245" text-anchor="end" font-size="11" fill="#484f58">11</text>
  <text x="58" y="245" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;frontend&quot;</tspan><tspan fill="#c9d1d9">    : [</tspan><tspan fill="#79c0ff">&quot;React&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;JavaScript&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;HTML5&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;CSS3&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="264" text-anchor="end" font-size="11" fill="#484f58">12</text>
  <text x="58" y="264" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;databases&quot;</tspan><tspan fill="#c9d1d9">   : [</tspan><tspan fill="#79c0ff">&quot;PostgreSQL&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;MySQL&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;MongoDB&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="283" text-anchor="end" font-size="11" fill="#484f58">13</text>
  <text x="58" y="283" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;devops&quot;</tspan><tspan fill="#c9d1d9">      : [</tspan><tspan fill="#79c0ff">&quot;Docker&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Git&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;GitHub Actions&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Linux&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="302" text-anchor="end" font-size="11" fill="#484f58">14</text>
  <text x="58" y="302" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;mobile&quot;</tspan><tspan fill="#c9d1d9">      : [</tspan><tspan fill="#79c0ff">&quot;Flutter&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Dart&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Android&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="38" y="321" text-anchor="end" font-size="11" fill="#484f58">15</text>
  <text x="58" y="321" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;architecture&quot;</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#79c0ff">&quot;System Design&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Microservices&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Clean Code&quot;</tspan><tspan fill="#c9d1d9">]</tspan></text>
  <text x="38" y="340" text-anchor="end" font-size="11" fill="#484f58">16</text>
  <text x="58" y="340" font-size="12.2" xml:space="preserve"><tspan fill="#c9d1d9">        }</tspan></text>
  <text x="38" y="359" text-anchor="end" font-size="11" fill="#484f58">17</text>
  <text x="38" y="378" text-anchor="end" font-size="11" fill="#484f58">18</text>
  <text x="58" y="378" font-size="12.2" xml:space="preserve"><tspan fill="#ff7b72">    def </tspan><tspan fill="#d2a8ff">get_mission</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ff7b72">self</tspan><tspan fill="#c9d1d9">):</tspan></text>
