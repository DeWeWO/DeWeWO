<svg width="600" height="230" viewBox="0 0 600 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .label { font-size: 11px; fill: #8b949e; font-weight: 600; }
    .value { font-size: 11px; fill: #c9d1d9; font-weight: 600; }
    .val-strong { font-size: 11px; fill: #58a6ff; font-weight: 700; }
    .header-title { font-size: 10px; fill: #58a6ff; letter-spacing: 1.5px; font-weight: 700; }
    .name-title { font-size: 15px; fill: #f0f6fc; font-weight: 700; }
    .class-title { font-size: 11px; fill: #3fb950; font-weight: 700; }
    .badge-txt { font-size: 9.5px; fill: #d29922; font-weight: 600; }
  </style>

  <!-- Outer Card -->
  <rect x="1" y="1" width="598" height="228" rx="8" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Decorative Header Bar -->
  <path d="M1 9C1 4.58172 4.58172 1 9 1H591C595.418 1 599 4.58172 599 9V32H1V9Z" fill="#161b22"/>
  <line x1="1" y1="32" x2="599" y2="32" stroke="#30363d" stroke-width="1"/>
  <circle cx="18" cy="16" r="4" fill="#f85149"/>
  <circle cx="32" cy="16" r="4" fill="#d29922"/>
  <circle cx="46" cy="16" r="4" fill="#3fb950"/>
  <text x="70" y="20" class="mono header-title">PLAYER CHARACTER SHEET // STATS</text>
  <text x="500" y="20" class="mono" font-size="10" fill="#8b949e">RANK: SS</text>

  <!-- Avatar Box -->
  <rect x="20" y="44" width="70" height="70" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
  <!-- Pixel Knight / Terminal Icon -->
  <text x="55" y="85" text-anchor="middle" font-size="28">⚡</text>

  <!-- Player Info -->
  <text x="105" y="60" class="mono name-title">Ollabergan "DeWeW"</text>
  <text x="105" y="77" class="mono class-title">LV. 24 SOFTWARE ENGINEER</text>
  <text x="105" y="93" class="mono" font-size="10.5" fill="#8b949e">GUILD: Backend &amp; Distributed Systems</text>
  <text x="105" y="108" class="mono" font-size="10.5" fill="#8b949e">TITLE: Scalable Architect</text>

  <!-- Vertical Divider -->
  <line x1="330" y1="42" x2="330" y2="185" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Left: Status Bars (HP, MP, EXP) -->
  <!-- HP Bar -->
  <text x="20" y="133" class="mono label">HP [STABILITY]</text>
  <text x="140" y="133" class="mono value">94 / 100</text>
  <rect x="20" y="138" width="180" height="7" rx="3.5" fill="#21262d"/>
  <rect x="20" y="138" width="170" height="7" rx="3.5" fill="url(#hpGrad)"/>

  <!-- MP Bar -->
  <text x="20" y="160" class="mono label">MP [ARCHITECTURE]</text>
  <text x="140" y="160" class="mono value">100 / 100</text>
  <rect x="20" y="165" width="180" height="7" rx="3.5" fill="#21262d"/>
  <rect x="20" y="165" width="180" height="7" rx="3.5" fill="url(#mpGrad)"/>

  <!-- EXP Bar -->
  <text x="20" y="187" class="mono label">EXP [PROGRESS]</text>
  <text x="140" y="187" class="mono value">780 / 1000</text>
  <rect x="20" y="192" width="180" height="7" rx="3.5" fill="#21262d"/>
  <rect x="20" y="192" width="140" height="7" rx="3.5" fill="url(#expGrad)"/>

  <!-- Right: Attributes & Skills -->
  <text x="350" y="60" class="mono label">STR [Backend]  :</text>
  <text x="460" y="60" class="mono val-strong">Python · Django · SQL</text>

  <text x="350" y="82" class="mono label">AGI [DevOps]   :</text>
  <text x="460" y="82" class="mono val-strong">Docker · Actions · Linux</text>

  <text x="350" y="104" class="mono label">INT [Web/API]  :</text>
  <text x="460" y="104" class="mono val-strong">REST · React · Microservices</text>

  <text x="350" y="126" class="mono label">VIT [Resilience]:</text>
  <text x="460" y="126" class="mono val-strong">Clean Code · Scalability</text>

  <!-- Right: Unlocked Perks / Abilities -->
  <rect x="350" y="145" width="230" height="54" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="163" class="mono" font-size="10" fill="#8b949e" font-weight="700">SPECIAL ABILITIES &amp; PERKS</text>
  <text x="360" y="184" class="mono badge-txt">🗡️ Async IO  🛡️ Containerized  ⚡ Zero Downtime</text>

  <!-- Bottom Accent Line -->
  <line x1="20" y1="214" x2="580" y2="214" stroke="#21262d" stroke-width="1"/>
  <text x="300" y="224" text-anchor="middle" class="mono" font-size="9" fill="#8b949e">// READY FOR NEXT QUEST: HIGH LOAD &amp; SCALABLE PROJECTS //</text>
</svg>