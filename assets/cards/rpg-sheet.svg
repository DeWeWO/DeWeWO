<svg width="660" height="255" viewBox="0 0 660 255" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .label { font-size: 11px; fill: #8b949e; font-weight: 600; }
    .value { font-size: 11px; fill: #c9d1d9; font-weight: 600; }
    .val-strong { font-size: 11px; fill: #58a6ff; font-weight: 700; }
    .header-title { font-size: 10.5px; fill: #58a6ff; letter-spacing: 1.5px; font-weight: 700; }
    .name-title { font-size: 15px; fill: #f0f6fc; font-weight: 700; }
    .class-title { font-size: 11px; fill: #3fb950; font-weight: 700; }
    .pill-txt { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="658" height="253" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Decorative Header Bar -->
  <path d="M1 10C1 5.02944 5.02944 1 10 1H650C654.971 1 659 5.02944 659 10V34H1V10Z" fill="#161b22"/>
  <line x1="1" y1="34" x2="659" y2="34" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="17" r="4.5" fill="#f85149"/>
  <circle cx="35" cy="17" r="4.5" fill="#d29922"/>
  <circle cx="50" cy="17" r="4.5" fill="#3fb950"/>
  <text x="75" y="21" class="mono header-title">PLAYER CHARACTER SHEET // STATS</text>
  <text x="560" y="21" class="mono" font-size="10.5" fill="#d29922" font-weight="700">RANK: SS 🏆</text>

  <!-- Left: Avatar (Retro Terminal SVG Box) -->
  <rect x="22" y="46" width="70" height="70" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <!-- Mini IDE Window in Avatar -->
  <path d="M22 52C22 48.6863 24.6863 46 28 46H86C89.3137 46 92 48.6863 92 52V58H22V52Z" fill="#21262d"/>
  <circle cx="29" cy="52" r="2" fill="#f85149"/>
  <circle cx="35" cy="52" r="2" fill="#d29922"/>
  <circle cx="41" cy="52" r="2" fill="#3fb950"/>
  <!-- Terminal Prompt & Code Glyphs -->
  <text x="30" y="80" class="mono" font-size="20" font-weight="900" fill="#58a6ff">&gt;_</text>
  <rect x="58" y="70" width="24" height="3" rx="1.5" fill="#3fb950"/>
  <rect x="58" y="77" width="18" height="3" rx="1.5" fill="#8b949e"/>
  <rect x="30" y="93" width="35" height="3" rx="1.5" fill="#bc8cff"/>
  <rect x="70" y="93" width="12" height="3" rx="1.5" fill="#58a6ff"/>

  <!-- Player Identity Info -->
  <text x="104" y="63" class="mono name-title">Ollabergan "DeWeW"</text>
  <text x="104" y="81" class="mono class-title">LV. 24 SOFTWARE ENGINEER</text>
  <text x="104" y="97" class="mono" font-size="10" fill="#8b949e">ROLE : Scalable System Architect</text>
  <text x="104" y="112" class="mono" font-size="10" fill="#8b949e">GUILD: Backend &amp; Distributed Systems</text>

  <!-- Vertical Dividing Line -->
  <line x1="325" y1="44" x2="325" y2="215" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Left: Status Bars (HP, MP, EXP) -->
  <!-- HP Bar -->
  <text x="22" y="137" class="mono label">HP [STABILITY]</text>
  <text x="250" y="137" text-anchor="end" class="mono value" fill="#3fb950">96 / 100</text>
  <rect x="22" y="143" width="280" height="7" rx="3.5" fill="#21262d"/>
  <rect x="22" y="143" width="268" height="7" rx="3.5" fill="url(#hpGrad)"/>

  <!-- MP Bar -->
  <text x="22" y="167" class="mono label">MP [ARCHITECTURE]</text>
  <text x="250" y="167" text-anchor="end" class="mono value" fill="#58a6ff">100 / 100</text>
  <rect x="22" y="173" width="280" height="7" rx="3.5" fill="#21262d"/>
  <rect x="22" y="173" width="280" height="7" rx="3.5" fill="url(#mpGrad)"/>

  <!-- EXP Bar -->
  <text x="22" y="197" class="mono label">EXP [PROGRESS]</text>
  <text x="250" y="197" text-anchor="end" class="mono value" fill="#bc8cff">780 / 1000</text>
  <rect x="22" y="203" width="280" height="7" rx="3.5" fill="#21262d"/>
  <rect x="22" y="203" width="218" height="7" rx="3.5" fill="url(#expGrad)"/>

  <!-- Right: Attributes & Skills (Plenty of space to prevent clipping) -->
  <text x="342" y="63" class="mono label">STR [Backend]  :</text>
  <text x="455" y="63" class="mono val-strong">Python · Django · SQL</text>

  <text x="342" y="85" class="mono label">AGI [DevOps]   :</text>
  <text x="455" y="85" class="mono val-strong">Docker · Actions · Linux</text>

  <text x="342" y="107" class="mono label">INT [Web/API]  :</text>
  <text x="455" y="107" class="mono val-strong">REST · React · Microservices</text>

  <text x="342" y="129" class="mono label">VIT [Quality]  :</text>
  <text x="455" y="129" class="mono val-strong">Clean Code · Scalability</text>

  <!-- Right: Active Perks Container -->
  <rect x="342" y="145" width="298" height="66" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="354" y="164" class="mono" font-size="9.5" fill="#8b949e" font-weight="700">ACTIVE PERKS &amp; SPECIAL ABILITIES</text>
  
  <!-- Perk Badges -->
  <!-- Perk 1 -->
  <rect x="354" y="174" width="84" height="25" rx="4" fill="#0d1117" stroke="#1f6feb" stroke-width="1"/>
  <text x="396" y="190" text-anchor="middle" class="mono pill-txt" fill="#58a6ff">⚡ Async IO</text>

  <!-- Perk 2 -->
  <rect x="444" y="174" width="102" height="25" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1"/>
  <text x="495" y="190" text-anchor="middle" class="mono pill-txt" fill="#3fb950">🛡️ Dockerized</text>

  <!-- Perk 3 -->
  <rect x="552" y="174" width="80" height="25" rx="4" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="592" y="190" text-anchor="middle" class="mono pill-txt" fill="#d29922">⚡ 99.9% Up</text>

  <!-- Bottom Accent / Quest Line -->
  <line x1="22" y1="230" x2="638" y2="230" stroke="#21262d" stroke-width="1"/>
  <text x="330" y="244" text-anchor="middle" class="mono" font-size="9" fill="#8b949e">// READY FOR NEXT QUEST: HIGH LOAD &amp; RESILIENT ARCHITECTURES //</text>
</svg>