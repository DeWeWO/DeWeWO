<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .label { font-size: 11.5px; fill: #8b949e; font-weight: 600; }
    .value { font-size: 11.5px; fill: #c9d1d9; font-weight: 600; }
    .val-strong { font-size: 11.5px; fill: #58a6ff; font-weight: 700; }
    .header-title { font-size: 11px; fill: #58a6ff; letter-spacing: 1.5px; font-weight: 700; }
    .name-title { font-size: 22px; fill: #f0f6fc; font-weight: 800; }
    .class-title { font-size: 12px; fill: #3fb950; font-weight: 700; }
    .pill-txt { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="848" height="258" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Window Header Bar -->
  <path d="M1 10C1 5.02944 5.02944 1 10 1H840C844.971 1 849 5.02944 849 10V34H1V10Z" fill="#161b22"/>
  <line x1="1" y1="34" x2="849" y2="34" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="17" r="4.5" fill="#f85149"/>
  <circle cx="35" cy="17" r="4.5" fill="#d29922"/>
  <circle cx="50" cy="17" r="4.5" fill="#3fb950"/>
  <text x="75" y="21" class="mono header-title">PLAYER CHARACTER SHEET // STATS</text>
  <text x="750" y="21" class="mono" font-size="11" fill="#d29922" font-weight="700">RANK: SS 🏆</text>

  <!-- Left: Avatar (Retro Terminal SVG Box) -->
  <rect x="25" y="48" width="76" height="76" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <!-- Mini IDE Window in Avatar -->
  <path d="M25 54C25 50.6863 27.6863 48 31 48H93C96.3137 48 99 50.6863 99 54V62H25V54Z" fill="#21262d"/>
  <circle cx="33" cy="55" r="2" fill="#f85149"/>
  <circle cx="39" cy="55" r="2" fill="#d29922"/>
  <circle cx="45" cy="55" r="2" fill="#3fb950"/>
  <!-- Terminal Prompt & Code Glyphs -->
  <text x="34" y="86" class="mono" font-size="22" font-weight="900" fill="#58a6ff">&gt;_</text>
  <rect x="64" y="75" width="26" height="3" rx="1.5" fill="#3fb950"/>
  <rect x="64" y="83" width="20" height="3" rx="1.5" fill="#8b949e"/>
  <rect x="34" y="103" width="40" height="3" rx="1.5" fill="#bc8cff"/>
  <rect x="78" y="103" width="13" height="3" rx="1.5" fill="#58a6ff"/>

  <!-- Player Identity Info (DeWeW directly) -->
  <text x="116" y="70" class="mono name-title">DeWeW</text>
  <text x="116" y="90" class="mono class-title">LV. 24 SOFTWARE ENGINEER</text>
  <text x="116" y="107" class="mono" font-size="11" fill="#8b949e">ROLE : Scalable System Architect</text>
  <text x="116" y="122" class="mono" font-size="11" fill="#8b949e">GUILD: Backend &amp; Distributed Systems</text>

  <!-- Vertical Divider Line -->
  <line x1="390" y1="48" x2="390" y2="225" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Left Column: Status Bars (HP, MP, EXP) -->
  <!-- HP Bar -->
  <text x="25" y="148" class="mono label">HP [STABILITY]</text>
  <text x="365" y="148" text-anchor="end" class="mono value" fill="#3fb950">96 / 100</text>
  <rect x="25" y="154" width="340" height="8" rx="4" fill="#21262d"/>
  <rect x="25" y="154" width="326" height="8" rx="4" fill="url(#hpGrad)"/>

  <!-- MP Bar -->
  <text x="25" y="178" class="mono label">MP [ARCHITECTURE]</text>
  <text x="365" y="178" text-anchor="end" class="mono value" fill="#58a6ff">100 / 100</text>
  <rect x="25" y="184" width="340" height="8" rx="4" fill="#21262d"/>
  <rect x="25" y="184" width="340" height="8" rx="4" fill="url(#mpGrad)"/>

  <!-- EXP Bar -->
  <text x="25" y="208" class="mono label">EXP [PROGRESS]</text>
  <text x="365" y="208" text-anchor="end" class="mono value" fill="#bc8cff">850 / 1000</text>
  <rect x="25" y="214" width="340" height="8" rx="4" fill="#21262d"/>
  <rect x="25" y="214" width="289" height="8" rx="4" fill="url(#expGrad)"/>

  <!-- Right Column: Attributes & Skills (Huge 410px width - Zero Clipping!) -->
  <text x="415" y="70" class="mono label">STR [Backend]  :</text>
  <text x="540" y="70" class="mono val-strong">Python · Django · PostgreSQL · REST APIs</text>

  <text x="415" y="93" class="mono label">AGI [DevOps]   :</text>
  <text x="540" y="93" class="mono val-strong">Docker · GitHub Actions · Linux · CI/CD</text>

  <text x="415" y="116" class="mono label">INT [Frontend] :</text>
  <text x="540" y="116" class="mono val-strong">React · JavaScript · System Design</text>

  <text x="415" y="139" class="mono label">VIT [Quality]  :</text>
  <text x="540" y="139" class="mono val-strong">Clean Architecture · 99.9% Resilience</text>

  <!-- Right Column: Active Perks Box (410px width) -->
  <rect x="415" y="155" width="412" height="66" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="427" y="173" class="mono" font-size="10" fill="#8b949e" font-weight="700">ACTIVE PERKS &amp; SPECIAL ABILITIES</text>
  
  <!-- Perk 1 -->
  <rect x="427" y="182" width="88" height="26" rx="4" fill="#0d1117" stroke="#1f6feb" stroke-width="1"/>
  <text x="471" y="198" text-anchor="middle" class="mono pill-txt" fill="#58a6ff">⚡ Async IO</text>

  <!-- Perk 2 -->
  <rect x="523" y="182" width="106" height="26" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1"/>
  <text x="576" y="198" text-anchor="middle" class="mono pill-txt" fill="#3fb950">🛡️ Containerized</text>

  <!-- Perk 3 -->
  <rect x="637" y="182" width="105" height="26" rx="4" fill="#0d1117" stroke="#8957e5" stroke-width="1"/>
  <text x="689" y="198" text-anchor="middle" class="mono pill-txt" fill="#bc8cff">⚡ Microservices</text>

  <!-- Perk 4 -->
  <rect x="750" y="182" width="67" height="26" rx="4" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="783" y="198" text-anchor="middle" class="mono pill-txt" fill="#d29922">✨ 99.9%</text>

  <!-- Bottom Line & Quest Slogan -->
  <line x1="25" y1="237" x2="827" y2="237" stroke="#21262d" stroke-width="1"/>
  <text x="425" y="250" text-anchor="middle" class="mono" font-size="9.5" fill="#8b949e">// QUEST: ENGINEERING RESILIENT, SCALABLE &amp; DISTRIBUTED SYSTEMS //</text>
</svg>