<svg width="780" height="430" viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg">
  <style>
    text, tspan { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { animation: blink 1s step-end infinite; }
  </style>
  <rect width="780" height="430" rx="10" fill="#0d1117"/>
  <text x="25" y="30" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">class </tspan><tspan fill="#7ee787">SoftwareEngineer</tspan><tspan fill="#c9d1d9">:</tspan></text>
  <text x="25" y="50" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">    def </tspan><tspan fill="#d2a8ff">__init__</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ff7b72">self</tspan><tspan fill="#c9d1d9">):</tspan></text>
  <text x="25" y="70" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">username</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;DeWeW&quot;</tspan></text>
  <text x="25" y="90" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">fullname</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;Ollabergan Zaripboyev&quot;</tspan></text>
  <text x="25" y="110" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">role</tspan><tspan fill="#c9d1d9">     = </tspan><tspan fill="#a5d6ff">&quot;Software Engineer&quot;</tspan></text>
  <text x="25" y="130" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">location</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">&quot;Urgench, Uzbekistan&quot;</tspan></text>
  <text x="25" y="150" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">status</tspan><tspan fill="#c9d1d9">   = </tspan><tspan fill="#a5d6ff">&quot;Open to Opportunities&quot;</tspan></text>
  <text x="25" y="190" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">        self</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#ffa657">stack</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
  <text x="25" y="210" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;backend&quot;</tspan><tspan fill="#c9d1d9">     : [</tspan><tspan fill="#79c0ff">&quot;Python&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Django&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;DRF&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;PHP&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Laravel&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="25" y="230" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;frontend&quot;</tspan><tspan fill="#c9d1d9">    : [</tspan><tspan fill="#79c0ff">&quot;React&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;JavaScript&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;HTML5&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;CSS3&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="25" y="250" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;databases&quot;</tspan><tspan fill="#c9d1d9">   : [</tspan><tspan fill="#79c0ff">&quot;PostgreSQL&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;MySQL&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;MongoDB&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="25" y="270" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;devops&quot;</tspan><tspan fill="#c9d1d9">      : [</tspan><tspan fill="#79c0ff">&quot;Docker&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Git&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;GitHub Actions&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Linux&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="25" y="290" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;mobile&quot;</tspan><tspan fill="#c9d1d9">      : [</tspan><tspan fill="#79c0ff">&quot;Flutter&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Dart&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Android&quot;</tspan><tspan fill="#c9d1d9">],</tspan></text>
  <text x="25" y="310" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">            </tspan><tspan fill="#a5d6ff">&quot;architecture&quot;</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#79c0ff">&quot;System Design&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Microservices&quot;</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#79c0ff">&quot;Clean Code&quot;</tspan><tspan fill="#c9d1d9">]</tspan></text>
  <text x="25" y="330" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">        }</tspan></text>
  <text x="25" y="370" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">    def </tspan><tspan fill="#d2a8ff">get_mission</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#ff7b72">self</tspan><tspan fill="#c9d1d9">):</tspan></text>
  <text x="25" y="390" font-size="13" xml:space="preserve"><tspan fill="#ff7b72">        return </tspan><tspan fill="#a5d6ff">&quot;Engineering resilient, scalable systems.&quot;</tspan></text>
  <rect x="25" y="414" width="8" height="3" rx="1" fill="#58a6ff" class="cursor"/>
</svg>