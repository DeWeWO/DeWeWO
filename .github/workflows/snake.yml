name: Generate Snake Animation

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake svg files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=white&color_dots=#161b22,#1e3a8a,#2563eb,#3b82f6,#38bdf8

      - name: Remove progress bar from SVGs
        run: |
          sed -i 's/<rect class="u[^>]*\/>//g' dist/github-contribution-grid-snake.svg
          sed -i 's/<rect class="u[^>]*\/>//g' dist/github-contribution-grid-snake-dark.svg

      - name: Push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
